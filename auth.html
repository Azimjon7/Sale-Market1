<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dodola — Kirish</title><link rel="stylesheet" href="css/customer-account.css"><link rel="stylesheet" href="css/dodola-tokens.css"><link rel="stylesheet" href="css/dodola-customer.css"><link rel="stylesheet" href="css/dodola-marketplace.css"></head><body class="auth-body dodola"><a class="dodola-skip" href="#dodola-content">Asosiy mazmunga o‘tish</a><header class="dodola-header"><div class="dodola-header__inner"><a class="dodola-logo" href="index.html" aria-label="Dodola — bosh sahifa">Dodola<span>·</span></a><form class="dodola-search" action="shop.html" method="get" role="search"><input type="search" name="search" placeholder="Nima izlayapsiz?" aria-label="Mahsulotlarni qidirish"><button aria-label="Qidirish" type="submit">⌕</button></form><nav aria-label="Do‘kon bo‘limlari"><a data-nav-page="shop" href="shop.html">Katalog</a><a data-nav-page="shop-cart" href="shop-cart.html"><span class="nav-label">Savat</span> <span class="js-cart-count">0</span></a><a data-nav-page="account" href="account.html">Profilim</a></nav></div></header><main id="dodola-content" class="auth-shell"><section class="auth-card"><a class="auth-brand" href="index.html"><span class="auth-mark">D</span><span>Dodola</span></a><h1>Kirish va ro‘yxatdan o‘tish</h1><p>Xaridlaringiz, manzillaringiz va buyurtmalaringiz — bir joyda.</p><div class="auth-tabs"><button id="loginTab" class="active">Kirish</button><button id="registerTab">Ro‘yxatdan o‘tish</button></div>
<form id="loginForm" class="auth-form"><div class="auth-field"><label for="identifier">Telefon raqami yoki admin logini</label><input id="identifier" autocomplete="username" required></div><div class="auth-field"><label for="loginPassword">Parol</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="auth-btn">Kirish</button><button id="forgotBtn" class="auth-link" type="button">Parolni unutdingizmi?</button></form>
<form id="registerForm" class="auth-form hidden"><div class="auth-field"><label>Ism</label><input name="firstName" required maxlength="80"></div><div class="auth-field"><label>Familiya</label><input name="lastName" required maxlength="80"></div><div class="auth-field"><label>Telefon</label><input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+998008000003" required></div><div class="auth-field"><label>Email</label><input name="email" type="email" required></div><div class="auth-field"><label>Parol</label><input name="password" type="password" minlength="10" required></div><div class="auth-field"><label>Parolni takrorlang</label><input name="confirmPassword" type="password" minlength="10" required></div><button class="auth-btn">Hisob yaratish</button></form>
<form id="forgotForm" class="auth-form hidden"><h2>Parolni tiklash</h2><div class="auth-field"><label>Email</label><input name="email" type="email" required></div><button class="auth-btn">Tiklash havolasini yuborish</button><button id="backLogin" class="auth-link" type="button">Kirishga qaytish</button></form><div id="authMessage" class="auth-message" role="status"></div></section></main><script src="js/auth-page.js"></script><script src="js/dodola-ui.js"></script></body></html>
