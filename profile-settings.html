<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dodola — Profil sozlamalari</title><link rel="stylesheet" href="css/font-awesome.min.css"><link rel="stylesheet" href="css/customer-account.css"><link rel="stylesheet" href="css/dodola-tokens.css"><link rel="stylesheet" href="css/dodola-customer.css"><link rel="stylesheet" href="css/dodola-marketplace.css"></head><body class="auth-body dodola settings-page"><header class="dodola-header"><div class="dodola-header__inner"><a class="dodola-logo" href="index.html">Dodola<span>·</span></a><nav><a href="account.html">Shaxsiy kabinet</a></nav></div></header><main class="settings-shell" id="dodola-content"><a class="d-text-button" href="account.html">← Profil</a><h1>Profil sozlamalari</h1><form id="profileSettingsForm" class="auth-form account-form-card"><div class="field-grid"><div class="auth-field"><label for="firstName">Ism</label><input id="firstName" name="firstName" autocomplete="given-name" required maxlength="80"></div><div class="auth-field"><label for="lastName">Familiya</label><input id="lastName" name="lastName" autocomplete="family-name" required maxlength="80"></div><div class="auth-field"><label for="middleName">Otasining ismi <small>ixtiyoriy</small></label><input id="middleName" name="middleName" autocomplete="additional-name" maxlength="80"></div><div class="auth-field"><label for="phone">Telefon raqami</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required pattern="\+998[0-9]{9}"></div><div class="auth-field wide"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></div></div><p class="account-note">Telefon yoki email o‘zgarsa, joriy parol talab qilinadi. Tasdiqlash alohida bajariladi.</p><div class="auth-field"><label for="currentPassword">Joriy parol (aloqa o‘zgarsa)</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" maxlength="128"></div><div id="profileVerification" class="account-verification"></div><button id="sendVerification" type="button" class="d-text-button">Tasdiqlash xatini yuborish</button><p class="account-note">Telefon tasdig‘i hali ulanmagan.</p><button class="auth-btn" type="submit" disabled>Saqlash</button><p id="settingsMessage" role="status" aria-live="polite"></p></form><section class="account-form-card settings-language"><h2>Ilova tili</h2><div data-language-slot></div></section></main><script src="js/profile-settings.js"></script><script src="js/dodola-ui.js"></script></body></html>
